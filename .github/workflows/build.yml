name: build

on:
  workflow_dispatch:
  push:
    tags: [ 'v*' ]

jobs:
  app-linux-x64:
    name: self-contained app + bundled fastboot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y libusb-1.0-0-dev pkg-config

      - name: Publish app and native components
        run: ./packaging/publish.sh publish-out

      - name: Smoke test
        run: test -x publish-out/Kirin-Tool && test -f publish-out/fastboot/payload

      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: kirin-tool-linux-app-${{ github.sha }}
          path: publish-out/

  appimage:
    name: Portable AppImage (glibc 2.31)
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04
    steps:
      - name: Install build dependencies
        run: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential pkg-config libusb-1.0-0-dev zlib1g-dev python3 curl binutils ca-certificates git libicu66 libssl1.1

      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build AppImage
        env:
          KIRIN_BUILD_COMMIT: ${{ github.sha }}
        run: |
          V="${GITHUB_REF_NAME#v}"
          case "$V" in main|*"/"*) V="2.4.2-stable.3-portable.1" ;; esac
          ./packaging/build-appimage.sh publish-out "$V"

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: kirin-tool-linux-appimage-${{ github.sha }}
          path: kirin-tool-linux-*.AppImage

  pacman-package:
    name: pacman package (Arch)
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Install toolchain
        run: |
          pacman -Syu --noconfirm git dotnet-sdk libusb pkgconf fontconfig freetype2 libx11 libice libsm openssl zlib icu

      - uses: actions/checkout@v4

      - name: Build package
        run: |
          useradd -m builder
          build=$(mktemp -d /home/builder/pkg-XXXX)
          cp packaging/PKGBUILD packaging/kirin-tool-linux.install "$build/"
          printf '%s\n' "$GITHUB_SHA" > BUILD-COMMIT
          tar czf "$build/kirin-tool-linux-2.4.2.tar.gz" \
            --exclude .git --exclude bin --exclude obj --exclude .github \
            --transform 's,^\.,kirin-tool-linux-2.4.2,' .
          chown -R builder:builder "$build"
          su builder -c "cd $build && makepkg -f --noconfirm"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: kirin-tool-linux-pacman-${{ github.sha }}
          path: /home/builder/pkg-*/kirin-tool-linux-*.pkg.tar.zst
